[project]
name = "phonelab"
version = "0.0.1"
description = "PhoneLab — スマホが実験器具。AIは答えを言わない。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.30",
    "google-adk[gcp]>=2.8",
    "google-genai>=2.22",
    "google-cloud-firestore>=2.19",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
