[project]
name = "phonelab"
version = "0.0.1"
description = "PhoneLab — スマホが実験器具。AIは答えを言わない。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.30",
    "google-adk>=2.8",
    "google-genai>=2.22",
    "google-cloud-modelarmor>=0.7",
    "google-cloud-firestore>=2.19",
    "google-cloud-kms>=3.0",
    "rfc8785>=0.1",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
