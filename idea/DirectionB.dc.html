<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&amp;family=BIZ+UDPGothic:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #12161C; color: #ECE6D8; font-family: "BIZ UDPGothic", "Hiragino Sans", sans-serif; }
    a { color: #F2C14E; } a:hover { color: #D9A93A; }
    h1, h2 { font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif; margin: 0; }
    p { margin: 0; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 1200px; height: 620px; box-sizing: border-box; background: #12161C; padding: 48px 56px; display: flex; flex-direction: column; gap: 28px;">
  <p style="font-size: 12px; letter-spacing: 0.2em; color: #8C94A0; font-weight: 700;">対案 B ／ 夜の実験室（ラフ）。本命は左の「理科ノート」調</p>
  <div style="display: flex; flex-direction: row; gap: 40px; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">
      <h1 style="font-size: 64px; line-height: 1.05; font-weight: 800; color: #ECE6D8;">答えは、<br>ポケットの中で<br>測る。</h1>
      <p style="font-size: 16px; line-height: 1.8; color: #B8BFC9; max-width: 520px;">PhoneLab。予想を書くと、Agent が反証実験を選び、スマホのセンサーが決める。派手な色を一つだけ。写真ではなく線画。</p>
      <div style="display: flex; flex-direction: row; gap: 10px;">
        <span style="font-size: 12px; font-weight: 700; padding: 6px 12px; border: 1.5px solid #F2C14E; color: #F2C14E; border-radius: 4px;">中高生</span>
        <span style="font-size: 12px; font-weight: 700; padding: 6px 12px; border: 1.5px solid #8C94A0; color: #B8BFC9; border-radius: 4px;">実機ゼロ</span>
      </div>
    </div>
    <svg width="360" height="300" viewBox="0 0 360 300" fill="none" stroke="#ECE6D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="20" y="20" width="320" height="260" rx="6" stroke="#3A424E" stroke-dasharray="6 6"></rect>
      <line x1="60" y1="50" x2="300" y2="50"></line>
      <circle cx="180" cy="50" r="4" fill="#ECE6D8"></circle>
      <line x1="180" y1="50" x2="222" y2="170"></line>
      <g transform="rotate(20 222 170)"><rect x="206" y="170" width="32" height="60" rx="6"></rect></g>
      <path d="M 96 190 A 90 90 0 0 0 264 190" stroke="#F2C14E" stroke-dasharray="5 6"></path>
      <text x="80" y="262" font-family="Shippori Mincho B1, serif" font-size="22" font-weight="800" fill="#F2C14E" stroke="none">T = 1.42 s</text>
    </svg>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;">
    <div style="border: 1.5px solid #3A424E; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 6px;"><p style="font-size: 12px; color: #8C94A0; font-weight: 700;">01</p><p style="font-size: 14px;">予想を書く</p></div>
    <div style="border: 1.5px solid #3A424E; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 6px;"><p style="font-size: 12px; color: #8C94A0; font-weight: 700;">02</p><p style="font-size: 14px;">実験を選ぶ・許可する</p></div>
    <div style="border: 1.5px solid #3A424E; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 6px;"><p style="font-size: 12px; color: #8C94A0; font-weight: 700;">03</p><p style="font-size: 14px;">測る・機械が検査</p></div>
    <div style="border: 1.5px solid #3A424E; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 6px;"><p style="font-size: 12px; color: #8C94A0; font-weight: 700;">04</p><p style="font-size: 14px;">反証か保留、次を予測</p></div>
  </div>
</div>
</x-dc>
</body>
</html>
