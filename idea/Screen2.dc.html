<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;family=BIZ+UDPGothic:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F3EA; color: #1E2A3A; font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    a { color: #B85C2A; } a:hover { color: #8F4620; }
    h1, h2, h3 { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; margin: 0; }
    p { margin: 0; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F3EA; padding: 60px 20px 24px 20px; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between;">
    <h1 style="font-size: 22px; font-weight: 900;">PhoneLab</h1>
    <span style="font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #1FA39F; color: #1E2A3A;">2 測定中</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0;">
    <p style="font-family: Zen Maru Gothic, Hiragino Maru Gothic ProN, sans-serif; font-size: 64px; font-weight: 900; line-height: 1;">20<span style="font-size: 28px; color: #5B6572;"> / 20 s</span></p>
    <p style="font-size: 13px; color: #5B6572;">重さ2倍の測定が終わりました。検査の結果です</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
    <div style="background: #FFFDF8; border: 2px solid #1E2A3A; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
      <p style="font-size: 12px; font-weight: 700; color: #5B6572;">加速度</p>
      <svg width="100%" height="48" viewBox="0 0 140 48" fill="none" stroke="#1FA39F" stroke-width="2" stroke-linecap="round"><path d="M2 24 C 10 4, 18 4, 26 24 S 42 44, 50 24 S 66 4, 74 24 S 90 44, 98 24 S 114 4, 122 24 S 134 40, 138 30"></path></svg>
      <p style="font-family: Zen Maru Gothic, Hiragino Maru Gothic ProN, sans-serif; font-size: 26px; font-weight: 900; line-height: 1;">1.42 <span style="font-size: 13px; color: #5B6572;">s</span></p>
    </div>
    <div style="background: #FFFDF8; border: 2px solid #1E2A3A; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
      <p style="font-size: 12px; font-weight: 700; color: #5B6572;">ジャイロ（独立した2本目）</p>
      <svg width="100%" height="48" viewBox="0 0 140 48" fill="none" stroke="#1FA39F" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"><path d="M2 8 C 10 8, 18 40, 26 40 S 42 8, 50 8 S 66 40, 74 40 S 90 8, 98 8 S 114 40, 122 40 S 134 12, 138 10"></path></svg>
      <p style="font-family: Zen Maru Gothic, Hiragino Maru Gothic ProN, sans-serif; font-size: 26px; font-weight: 900; line-height: 1;">1.43 <span style="font-size: 13px; color: #5B6572;">s</span></p>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; background: #FFFDF8; border: 2px solid #D9D2C3; border-radius: 14px; padding: 14px;">
    <p style="font-size: 12px; font-weight: 700; color: #5B6572;">機械の検査（Agent は見ていない）</p>
    <div style="display: flex; flex-direction: row; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1FA39F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"></path></svg>
      <p style="font-size: 13px;">欠測なし（60 Hz で連続）</p>
    </div>
    <div style="display: flex; flex-direction: row; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1FA39F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"></path></svg>
      <p style="font-size: 13px;">飽和なし</p>
    </div>
    <div style="display: flex; flex-direction: row; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1FA39F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"></path></svg>
      <p style="font-size: 13px;">二つのセンサーの周期が一致（差 0.01 s、許容 0.05 s）</p>
    </div>
  </div>

  <div style="display: flex; flex-direction: row; align-items: center; gap: 10px; background: #EEE7D8; border-radius: 12px; padding: 12px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"></path><path d="M12 10v5"></path><path d="M12 18v.5"></path></svg>
    <p style="font-size: 12px; line-height: 1.5;">前回の測定は 0.5 秒の欠測があり、結論を保留しました。今回はその再測定です。</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto;">
    <p style="font-size: 12px; color: #5B6572; text-align: center;">送信したのは数値 5 つとフラグ 3 つ、約 100 バイト。波形は端末の中（表示はサンプル値）</p>
    <div style="height: 48px; border-radius: 14px; border: 2px solid #1E2A3A; color: #1E2A3A; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;">測定をやめる</div>
  </div>
</div>
</x-dc>
</body>
</html>
