<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;family=BIZ+UDPGothic:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F3EA; color: #1E2A3A; font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    a { color: #B85C2A; } a:hover { color: #8F4620; }
    h1, h2, h3 { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; margin: 0; }
    p { margin: 0; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F3EA; padding: 60px 20px 24px 20px; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between;">
    <h1 style="font-size: 22px; font-weight: 900;">PhoneLab</h1>
    <span style="font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #E27A3F; color: #1E2A3A;">3 結果</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
    <div style="background: #FFFDF8; border: 2px solid #1E2A3A; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
      <p style="font-size: 12px; font-weight: 700; color: #5B6572;">重さ 1倍</p>
      <p style="font-family: Zen Maru Gothic, Hiragino Maru Gothic ProN, sans-serif; font-size: 30px; font-weight: 900; line-height: 1;">1.42 <span style="font-size: 13px; color: #5B6572;">s</span></p>
    </div>
    <div style="background: #FFFDF8; border: 2px solid #1E2A3A; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px;">
      <p style="font-size: 12px; font-weight: 700; color: #5B6572;">重さ 2倍</p>
      <p style="font-family: Zen Maru Gothic, Hiragino Maru Gothic ProN, sans-serif; font-size: 30px; font-weight: 900; line-height: 1;">1.43 <span style="font-size: 13px; color: #5B6572;">s</span></p>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; background: #1E2A3A; color: #F7F3EA; border-radius: 16px; padding: 16px;">
    <p style="font-size: 12px; font-weight: 700; color: #B8C0CA;">測定が言っていること</p>
    <h2 style="font-size: 20px; font-weight: 700; line-height: 1.35; color: #F7F3EA;">重さを2倍にしても、周期は変わらなかった</h2>
    <p style="font-size: 13px; line-height: 1.6; color: #B8C0CA;">あなたの予想「重いほど速い」は、この測定では成り立たなかった。差 0.01 s は許容誤差 0.05 s の内側です（表示はサンプル値）。</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <p style="font-size: 13px; font-weight: 700; color: #5B6572;">なぜそうなったと思う？　自分の言葉で</p>
    <div style="background: #FFFDF8; border: 2px solid #D9D2C3; border-radius: 14px; padding: 14px; min-height: 72px; display: flex; flex-direction: column;">
      <p style="font-size: 14px; line-height: 1.6; color: #8A93A0;">たとえば：引っ張る力は強くなるけど、動かしにくさも…</p>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; background: #FFFDF8; border: 2px solid #E27A3F; border-radius: 16px; padding: 16px;">
    <div style="display: flex; flex-direction: row; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E27A3F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 00-4 10.5c.8.7 1 1.5 1 2.5h6c0-1 .2-1.8 1-2.5A6 6 0 0012 3z"></path></svg>
      <p style="font-size: 13px; font-weight: 700; color: #E27A3F;">次の予測</p>
    </div>
    <p style="font-size: 15px; line-height: 1.5; font-weight: 700;">では、糸の長さを2倍にしたら周期はどうなる？</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 44px; border-radius: 10px; border: 2px solid #1E2A3A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">速くなる</div>
      <div style="height: 44px; border-radius: 10px; border: 2px solid #1E2A3A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">変わらない</div>
      <div style="height: 44px; border-radius: 10px; border: 2px solid #1E2A3A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">遅くなる</div>
    </div>
    <p style="font-size: 12px; color: #5B6572;">予測を書いてから、次の実験へ進めます</p>
  </div>

  <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 6px;">
    <div style="display: flex; flex-direction: row; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"></circle><path d="M9 9l2 2 4-4"></path><path d="M8 14l-1 8 5-3 5 3-1-8"></path></svg>
      <p style="font-size: 12px; font-weight: 700;">署名付きの実験記録</p>
    </div>
    <div style="display: flex; flex-direction: row; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
      <p style="font-size: 12px; font-weight: 700;">トレースを見る</p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
